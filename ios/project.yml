name: Avrit
options:
  bundleIdPrefix: in.bighelpers
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: PG2MGPAQ76
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Avrit:
    type: application
    platform: iOS
    sources:
      - path: Avrit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.bighelpers.avrit
        PRODUCT_NAME: Avrit
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Avrit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: Add a photo to remember the care you completed.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose photos for your Avrit profile or completion journal.
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Copy web app
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          bash "${SRCROOT}/../scripts/copy-web.sh" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/www"
    scheme:
      gatherCoverageData: false
